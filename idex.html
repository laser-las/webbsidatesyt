<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="repetition.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="page">
        <img src="image5.png" alt="f1 bil" class="img-2">
        <img src="image3.png" alt="ferrari loga" class="img-1">
        <img src="image2.png" alt="leclar bild" class="img-5">

        <a href="https://www.ferrari.com/en-SE" target="_blank" rel="noopener noreferrer" class="ferrari-link">
            Ferrari
        </a>

        <img src="image1.png" alt="ferrari bil" class="img-3">
        <img src="image4.png" alt="hamham bild" class="img-4">
    </div>
    <main class="exercise-area">
        <section class="welcome-section" aria-labelledby="welcomeHeading">
            <h1 id="welcomeHeading">Min portfolio</h1>
            <button id="welcomeButton" type="button">Visa välkomstmeddelande</button>
            <p id="welcomeMessage" role="status"></p>
        </section>

        <section class="controls-section" aria-labelledby="controlsHeading">
            <div class="section-heading">
                <h2 id="controlsHeading">Interaktiv portfolio</h2>
                <button id="themeButton" type="button">Mörkt tema</button>
            </div>
            <div class="filter-controls" aria-label="Filtrera projekt">
                <button class="filter-button active" type="button" data-filter="all">Alla</button>
                <button class="filter-button" type="button" data-filter="html">HTML</button>
                <button class="filter-button" type="button" data-filter="javascript">JavaScript</button>
                <button class="filter-button" type="button" data-filter="python">Python</button>
            </div>
            <div class="projects" id="projectList">
                <article class="project" data-category="html">
                    <h3>Webbsida</h3>
                    <p>En responsiv sida byggd med HTML och CSS.</p>
                </article>
                <article class="project" data-category="javascript">
                    <h3>Portfolio</h3>
                    <p>Interaktivitet och DOM-manipulation med JavaScript.</p>
                </article>
                <article class="project" data-category="python">
                    <h3>Dashboard</h3>
                    <p>En dashboard som visar data från ett Python-projekt.</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <h2>Kontakta mig</h2>
        <form id="contactForm" class="contact-form">
            <label for="email">Din e-post</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="message">Meddelande</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Skriv mail</button>
        </form>
        <p id="contactStatus" role="status"></p>
        <p>© <span id="currentYear"></span> Min portfolio</p>
    </footer>
</body>
</html>
